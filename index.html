      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }
    .banner img {
      width: 100%;
    }
    .banner h2 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background-color: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 8px;
    }
    .buttons {
      margin-top: 20px;
    }
    .buttons a img {
      margin: 5px;
    }
  </style>
</head>
