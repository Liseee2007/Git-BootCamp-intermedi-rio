<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portfólio de Anelise Lemes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #f0f4ff, #ffeef7);
      color: #333;
      text-align: center;
    }
    header {
      background-color: #222;
      color: white;
      padding: 40px 20px;
    }
    header h1 {
      margin: 0;
      font-size: 2.5em;
    }
    .banner {
      position: relative;
      max-width: 1000px;
      margin: 20px auto;
    }
    .banner img {
      width: 100%;
      border-radius: 10px;
    }
    .banner h2 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background-color: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1.8em;
    }
    .buttons {
      margin: 30px 0;
    }
    .buttons a img {
      margin: 10px;
      transition: transform 0.2s;
    }
    .buttons a img:hover {
      transform: scale(1.1);
    }
    footer {
      background-color: #222;
      color: white;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Portfólio de Anelise Lemes</h1>
  </header>

  <div class="banner">
    <img src="banner.png" alt="Banner do Portfólio">
    <h2>Bem-vindo ao meu Portfólio</h2>
  </div>

  <div class="buttons">
    <a href="https://sites.google.com/view/profissional-lise/início?authuser=0">
      <img src="https://img.shields.io/badge/GOOGLE%20SITES-blue?style=for-the-badge&logo=google">
    </a>
    <a href="https://liseee2007.github.io/Git-BootCamp-intermedi-rio/">
      <img src="https://img.shields.io/badge/GITHUB%20PAGES-black?style=for-the-badge&logo=github">
    </a>
    <a href="https://www.linkedin.com/in/anelise-lemes/">
      <img src="https://img.shields.io/badge/LINKEDIN-darkblue?style=for-the-badge&logo=linkedin">
    </a>
    <a href="mailto:aneliselemes865@gmail.com">
      <img src="https://img.shields.io/badge/EMAIL-red?style=for-the-badge&logo=gmail">
    </a>
  </div>

  <footer>
    <p>© 2026 - Desenvolvido por Anelise Lemes</p>
  </footer>
</body>
</html>
