<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portfólio de Anelise Lemes</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #fff0f6;
      color: #333;
    }
    /* Hero Section */
    .hero {
      height: 100vh;
      background: linear-gradient(135deg, #ffb6c1, #ff69b4, #ffc0cb);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 0 20px;
    }
    .hero h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 1.3em;
      margin-bottom: 30px;
    }
    .hero .buttons a img {
      margin: 10px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .hero .buttons a img:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    /* Seções */
    section {
      max-width: 1000px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    section h2 {
      color: #ff69b4;
      margin-bottom: 15px;
      text-align: center;
    }
    section p {
      line-height: 1.6;
      text-align: center;
    }
    /* Projetos */
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: #ffe6f0;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card h3 {
      color: #ff69b4;
      margin-bottom: 10px;
    }
    .card p {
      font-size: 0.95em;
      margin-bottom: 15px;
    }
    /* Contatos */
    .contacts {
      text-align: center;
    }
    .contacts a img {
      margin: 10px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .contacts a img:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    footer {
      background: #ff69b4;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <h1>Portfólio de Anelise Lemes</h1>
    <p>Explorando tecnologia com criatividade e dedicação ✨</p>
    <div class="buttons">
      <a href="mailto:aneliselemes865@gmail.com">
        <img src="https://img.shields.io/badge/GMAIL-pink?style=for-the-badge&logo=gmail">
